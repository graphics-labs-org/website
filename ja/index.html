    <script>
    // --- i18n URL Router ---
    (function() {
        window.__GL_LANG = 'ja';
        window.__GL_LANG_UPPER = 'JA';
        window.__GL_LANGS = ['es', 'ca', 'en', 'fr', 'de', 'pt', 'it', 'nl', 'ja'];
        
        // Override localStorage to always use URL-based language
        localStorage.setItem('gl_lang', 'ja');
        
        // Language switcher: navigate to the equivalent page in the target language folder
        window.switchLangUrl = function(targetLang) {
            var path = window.location.pathname;
            // Replace current lang segment with target lang
            var newPath = path.replace(/^\/(es|ca|en|fr|de|pt|it|nl|ja)\//, '/' + targetLang.toLowerCase() + '/');
            if (newPath === path) {
                // Fallback: prepend lang
                newPath = '/' + targetLang.toLowerCase() + '/';
            }
            window.location.href = newPath + window.location.hash;
        };
        
        // Auto-call setLang on DOMContentLoaded to apply translations
        // Some labs use uppercase keys (ES/EN), others lowercase (es/en)
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof setLang === 'function') {
                // Try uppercase first (used by most lab pages with inline translations)
                try { setLang('JA'); } catch(e) {}
                // Also try lowercase (used by magic-square style pages)
                try { setLang('ja'); } catch(e) {}
            }
        });
    })();
    </script>

    <script>
        /* --- MOTOR DE TRADUCCIÓN --- */
        function setLang(lang) {
            localStorage.setItem('gl_lang', lang);
            document.querySelectorAll('.lang-switch button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.id === `btn-${lang}`) btn.classList.add('active');
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const path = el.getAttribute('data-i18n').split('.');
                let translation = translations[lang];
                path.forEach(key => { if (translation) translation = translation[key]; });
                if (translation) el.innerHTML = translation;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('gl_lang') || 'es';
            setLang(savedLang);
        });

        /* --- FONDO INTERACTIVO ORIGINAL --- */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray;
        let mouse = { x: null, y: null, radius: (canvas.height/130) * (canvas.width/130) };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        // --- AÑADE ESTO PARA MÓVILES ---
window.addEventListener('touchmove', function(event) {
    if (event.touches.length > 0) {
        mouse.x = event.touches[0].clientX;
        mouse.y = event.touches[0].clientY;
    }
}, { passive: true });

window.addEventListener('touchend', function() {
    mouse.x = null;
    mouse.y = null;
});
// ------------------------------

        class Particle {
            constructor(x, y, directionX, directionY, size) {
                this.x = x; this.y = y;
                this.directionX = directionX; this.directionY = directionY;
                this.size = size;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                ctx.fillStyle = '#00f3ff';
                ctx.fill();
            }
            update() {
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;
                
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < mouse.radius + this.size){
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) this.x += 2;
                    if (mouse.x > this.x && this.x > this.size * 10) this.x -= 2;
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) this.y += 2;
                    if (mouse.y > this.y && this.y > this.size * 10) this.y -= 2;
                }
                this.x += this.directionX * 0.4;
                this.y += this.directionY * 0.4;
                this.draw();
            }
        }

        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 5000;
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 1.5) + 0.5;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 1) - 0.5;
                let directionY = (Math.random() * 1) - 0.5;
                particlesArray.push(new Particle(x, y, directionX, directionY, size));
            }
        }

        function connect(){
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                    + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < (canvas.width/9) * (canvas.height/9)) {
                        let opacityValue = 1 - (distance/15000);
                        ctx.strokeStyle = 'rgba(0, 243, 255,' + opacityValue + ')';
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        window.addEventListener('resize', function(){
            canvas.width = innerWidth;
            canvas.height = innerHeight;
            mouse.radius = ((canvas.height/130) * (canvas.height/130));
            init();
        });

        init();
        animate();
    </script>
