<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphics Labs | Art & Code</title>
    <meta name="description" content="Interactive visual experiments laboratory. Sacred geometry, fractals, cymatics, mathematics and generative art.">
    <link rel="canonical" href="https://graphics-labs.org/es/" />
    <link rel="alternate" hreflang="es" href="https://graphics-labs.org/es/" />
    <link rel="alternate" hreflang="ca" href="https://graphics-labs.org/ca/" />
    <link rel="alternate" hreflang="en" href="https://graphics-labs.org/en/" />
    <link rel="alternate" hreflang="fr" href="https://graphics-labs.org/fr/" />
    <link rel="alternate" hreflang="de" href="https://graphics-labs.org/de/" />
    <link rel="alternate" hreflang="pt" href="https://graphics-labs.org/pt/" />
    <link rel="alternate" hreflang="it" href="https://graphics-labs.org/it/" />
    <link rel="alternate" hreflang="nl" href="https://graphics-labs.org/nl/" />
    <link rel="alternate" hreflang="ja" href="https://graphics-labs.org/ja/" />
    <link rel="alternate" hreflang="x-default" href="https://graphics-labs.org/es/" />
    <script>
    (function() {
        var supported = ['es', 'ca', 'en', 'fr', 'de', 'pt', 'it', 'nl', 'ja'];
        var defaultLang = 'es';
        
        // Check localStorage first
        var saved = null;
        try { saved = localStorage.getItem('gl_lang'); } catch(e) {}
        
        // Then check browser language
        var browserLang = (navigator.language || navigator.userLanguage || '').substring(0, 2).toLowerCase();
        
        var lang = defaultLang;
        if (saved && supported.indexOf(saved) !== -1) {
            lang = saved;
        } else if (supported.indexOf(browserLang) !== -1) {
            lang = browserLang;
        }
        
        window.location.replace('/' + lang + '/');
    })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=/es/">
    </noscript>
</head>
<body>
    <p>Redirecting... <a href="/es/">Click here</a> if not redirected.</p>
</body>
