    // --- i18n URL Router ---
    (function() {
        window.__GL_LANG = 'de';
        window.__GL_LANG_UPPER = 'DE';
        window.__GL_LANGS = ['es', 'ca', 'en', 'fr', 'de', 'pt', 'it', 'nl', 'ja'];
        
        // Override localStorage to always use URL-based language
        localStorage.setItem('gl_lang', 'de');
        
        // Language switcher: navigate to the equivalent page in the target language folder
        window.switchLangUrl = function(targetLang) {
            var path = window.location.pathname;
            // Replace current lang segment with target lang
            var newPath = path.replace(/^\/(es|ca|en|fr|de|pt|it|nl|ja)\//, '/' + targetLang.toLowerCase() + '/');
            if (newPath === path) {
                // Fallback: prepend lang
                newPath = '/' + targetLang.toLowerCase() + '/';
            }
            window.location.href = newPath + window.location.hash;
        };
        
        // Auto-call setLang on DOMContentLoaded to apply translations
        // Some labs use uppercase keys (ES/EN), others lowercase (es/en)
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof setLang === 'function') {
                // Try uppercase first (used by most lab pages with inline translations)
                try { setLang('DE'); } catch(e) {}
                // Also try lowercase (used by magic-square style pages)
                try { setLang('de'); } catch(e) {}
            }
        });
    })();
    </script>

    <script>
        function setLang(lang) {
            localStorage.setItem('gl_lang', lang);
            document.querySelectorAll('.lang-switch button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.id === `btn-${lang}`) btn.classList.add('active');
            });
            const fullDict = {...translations[lang], ...geometryWorld[lang]};
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const path = el.getAttribute('data-i18n').split('.');
                let translation = fullDict;
                path.forEach(key => { if (translation) translation = translation[key]; });
                if (translation) el.innerHTML = translation;
            });
        }
        document.addEventListener('DOMContentLoaded', () => { setLang(localStorage.getItem('gl_lang') || 'es'); });

        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray;
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();

        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        
        const symbols = ['Φ', '∆', '⬡', '∞', '⚛', '✺', '✧', '❂'];

        class Particle {
            constructor(x, y, dx, dy, size) {
                this.x = x; this.y = y; this.dx = dx; this.dy = dy; this.size = size;
                this.text = symbols[Math.floor(Math.random() * symbols.length)];
            }
            draw() { 
               ctx.font = this.size + 'px serif';
               ctx.fillStyle = 'rgba(0, 255, 65, 0.25)';
               ctx.fillText(this.text, this.x, this.y);
            }
            update() {
                if(this.x > canvas.width || this.x < 0) this.dx = -this.dx;
                if(this.y > canvas.height || this.y < 0) this.dy = -this.dy;
                
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < mouse.radius){
                    this.x -= (dx/dist) * 3;
                    this.y -= (dy/dist) * 3;
                }
                
                this.x += this.dx * 0.5;
                this.y += this.dy * 0.5;
                this.draw();
            }
        }

        function init(){
            particlesArray = [];
            let n = (canvas.height * canvas.width) / 15000;
            for(let i=0; i<n; i++){
                particlesArray.push(new Particle(Math.random()*canvas.width, Math.random()*canvas.height, (Math.random()*1)-0.5, (Math.random()*1)-0.5, Math.random()*20 + 10));
            }
        }

        function animate(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => p.update());
            requestAnimationFrame(animate);
        }
        
        init(); animate();
        window.addEventListener('resize', () => { resizeCanvas(); init(); });
    </script>
