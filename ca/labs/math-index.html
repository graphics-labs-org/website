    <script>
    // --- i18n URL Router ---
    (function() {
        window.__GL_LANG = 'ca';
        window.__GL_LANG_UPPER = 'CA';
        window.__GL_LANGS = ['es', 'ca', 'en', 'fr', 'de', 'pt', 'it', 'nl', 'ja'];
        
        // Override localStorage to always use URL-based language
        localStorage.setItem('gl_lang', 'ca');
        
        // Language switcher: navigate to the equivalent page in the target language folder
        window.switchLangUrl = function(targetLang) {
            var path = window.location.pathname;
            // Replace current lang segment with target lang
            var newPath = path.replace(/^\/(es|ca|en|fr|de|pt|it|nl|ja)\//, '/' + targetLang.toLowerCase() + '/');
            if (newPath === path) {
                // Fallback: prepend lang
                newPath = '/' + targetLang.toLowerCase() + '/';
            }
            window.location.href = newPath + window.location.hash;
        };
        
        // Auto-call setLang on DOMContentLoaded to apply translations
        // Some labs use uppercase keys (ES/EN), others lowercase (es/en)
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof setLang === 'function') {
                // Try uppercase first (used by most lab pages with inline translations)
                try { setLang('CA'); } catch(e) {}
                // Also try lowercase (used by magic-square style pages)
                try { setLang('ca'); } catch(e) {}
            }
        });
    })();
    </script>

    <script>
        function setLang(lang) {
            localStorage.setItem('gl_lang', lang);
            document.querySelectorAll('.lang-switch button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.id === `btn-${lang}`) btn.classList.add('active');
            });
            const fullDict = {...translations[lang], ...mathWorld[lang]};
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const path = el.getAttribute('data-i18n').split('.');
                let translation = fullDict;
                path.forEach(key => { if (translation) translation = translation[key]; });
                if (translation) el.innerHTML = translation;
            });
        }
        document.addEventListener('DOMContentLoaded', () => { setLang(localStorage.getItem('gl_lang') || 'es'); });

        /* --- FONDO ANIMADO ORIGINAL (RESTAURADO) --- */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray;
        let mouse = { x: null, y: null, radius: 150 };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        window.addEventListener('mousemove', function(e) { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('touchmove', function(e) { 
            mouse.x = e.touches[0].clientX; 
            mouse.y = e.touches[0].clientY; 
        }, {passive: true});
        window.addEventListener('touchstart', function(e) { 
            mouse.x = e.touches[0].clientX; 
            mouse.y = e.touches[0].clientY; 
        }, {passive: true});
        window.addEventListener('touchend', function() { mouse.x = null; mouse.y = null; });
        
        const symbols = ['0', '1', 'π', '∞', '∑', '√', '∫', '≠', '≈', 'ϕ', 'e', 'x'];

        class Particle {
            constructor(x, y, dx, dy, size) {
                this.x = x; this.y = y; this.dx = dx; this.dy = dy; this.size = size;
                this.text = symbols[Math.floor(Math.random() * symbols.length)];
            }
            draw() { 
               ctx.font = this.size + 'px serif';
               ctx.fillStyle = 'rgba(0, 255, 65, 0.4)';
               ctx.fillText(this.text, this.x, this.y);
            }
            update() {
                if(this.x > canvas.width || this.x < 0) this.dx = -this.dx;
                if(this.y > canvas.height || this.y < 0) this.dy = -this.dy;
                
                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if(dist < mouse.radius){
                        const forceDirectionX = dx / dist;
                        const forceDirectionY = dy / dist;
                        const force = (mouse.radius - dist) / mouse.radius;
                        this.x -= forceDirectionX * force * 5;
                        this.y -= forceDirectionY * force * 5;
                    }
                }
                
                this.x += this.dx * 0.4;
                this.y += this.dy * 0.4;
                this.draw();
            }
        }

        function init(){
            particlesArray = [];
            let n = (canvas.height * canvas.width) / 9000;
            for(let i=0; i<n; i++){
                let size = (Math.random() * 20) + 10;
                particlesArray.push(new Particle(
                    Math.random() * canvas.width, 
                    Math.random() * canvas.height, 
                    (Math.random() * 1) - 0.5, 
                    (Math.random() * 1) - 0.5, 
                    size
                ));
            }
        }

        function animate(){
            requestAnimationFrame(animate); 
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for(let i=0; i<particlesArray.length; i++){ particlesArray[i].update(); }
        }

        let resizeTimeout;
        window.addEventListener('resize', ()=>{ 
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                resizeCanvas();
                init();
            }, 100);
        });
        
        init(); animate();
    </script>
